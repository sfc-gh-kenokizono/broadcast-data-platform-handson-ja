install:
  commands:
    - ["npm", "ci", "--include=dev"]

build:
  commands:
    - ["npm", "run", "build"]
    - ["cp", "-r", ".next/static", ".next/standalone/.next/static"]
    - ["cp", "-r", "public", ".next/standalone/public"]
    - ["rm", "-rf", "node_modules"]

run:
  command: ["node", ".next/standalone/server.js"]

profile:
  label: "5局横断 視聴インテリジェンス"
  description: "放送視聴ダッシュボードとVIEWING_AGENTを統合した講師デモ"
  icon: "public/icon.svg"