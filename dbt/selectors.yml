# タグにより実行する局／共通モデルを選びます。同名のtargetをprofiles.ymlから選び、計算用WHも合わせます。
# cautiousは参照先がすべて選択範囲に入るテストだけを自動選択します。commonのために上流の局別モデルを再実行しません。
selectors:
  - name: nw01
    definition:
      method: tag
      value: nw01
      indirect_selection: cautious
  - name: nw02
    definition:
      method: tag
      value: nw02
      indirect_selection: cautious
  - name: nw03
    definition:
      method: tag
      value: nw03
      indirect_selection: cautious
  - name: nw04
    definition:
      method: tag
      value: nw04
      indirect_selection: cautious
  - name: nw05
    definition:
      method: tag
      value: nw05
      indirect_selection: cautious
  - name: common
    definition:
      method: tag
      value: common
      indirect_selection: cautious